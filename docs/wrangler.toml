# Cloudflare Workers static-assets configuration for the Grove docs site.
#
# The docs is a static Astro site that builds to ./dist. The build pipeline
# runs `npm run build` (from the Cloudflare dashboard), then invokes
# `wrangler deploy` to upload the result. This file configures that deploy
# step in the Workers-with-Assets schema.
#
# This file also (and more importantly) prevents wrangler's automatic Astro
# detection. Without it, `runAutoConfig` downloads @astrojs/cloudflare and
# injects it into astro.config.mjs; the adapter's vite plugin transitively
# requires `prismjs` (a devDependency of @astrojs/cloudflare, not bundled
# with it), producing:
#
#   Cannot find package 'prismjs' imported from
#   .../@astrojs/cloudflare/dist/vite-plugin-prism.js
#
# The `pages_build_output_dir` field was tried first, but the build env
# runs `wrangler deploy` (Workers CLI), not `wrangler pages deploy` (Pages
# CLI), so wrangler rejects the Pages schema. The [assets] block below is
# the Workers-with-Assets equivalent for deploying a static directory.

name = "grove-docs"
compatibility_date = "2026-06-11"

[assets]
directory = "./dist"
