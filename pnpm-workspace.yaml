packages:
  - packages/core
  - packages/astro
  - packages/cli
  - packages/registry
  - packages/starlight
  - apps/example
  - apps/docs

auditConfig:
  # extract-zip (via lighthouse > puppeteer-core > @puppeteer/browsers) has
  # no fixed release. Both advisories are about extracting an untrusted
  # archive; here it only unpacks Chrome downloaded from Google's CDN for
  # `grove audit`. Revisit when lighthouse drops or patches it.
  ignoreGhsas:
    - GHSA-jmr9-qjv8-65gv
    - GHSA-7pqw-9j4j-h8q3
    # http-cache-semantics (via astro) has no fixed release. Astro uses it
    # for its image-fetch cache at build time on URLs the site author
    # chose. Revisit when a patched version ships.
    - GHSA-ch52-4w7c-c8xp
    # zod 3 (via lighthouse > puppeteer-core > chromium-bidi) has no fixed
    # 3.x release; the fix is only in zod >=4.6.6. chromium-bidi validates
    # CDP messages from the local Chrome that `grove audit` launches, not
    # user input. zod 4 is held at >=4.6.6 by the override below. Revisit
    # when chromium-bidi moves to zod 4.
    - GHSA-mrhx-c7xc-m3w5
    # deepmerge (via shadcn) has no fixed release. shadcn merges its own
    # registry config at `grove init` time. Revisit when shadcn drops it.
    - GHSA-gcqx-w48m-w2h4

linkWorkspacePackages: true

overrides:
  sharp@<0.35.0: '>=0.35.0'
  yaml@>=2.0.0 <2.8.3: '>=2.8.3'
  '@opentelemetry/core@<2.8.0': '>=2.8.0'
  fast-uri@>=3.0.0 <3.1.6: ^3.1.6
  js-yaml@>=4.0.0 <4.3.2: ^4.3.2
  smol-toml@<1.7.1: ^1.7.1
  postcss-selector-parser@>=6.1.0 <6.1.3: ^6.1.3
  devalue@<5.9.2: ^5.9.2
  qs@>=2.2.5 <6.16.0: ^6.16.0
  undici@>=8.0.0 <8.10.2: ^8.10.2
  brace-expansion@>=2.0.0 <2.1.6: ^2.1.6
  basic-ftp@<6.2.1: ^6.2.1
  fflate@>=0.7.0 <0.7.5: ^0.7.5
  zod@>=4.0.0 <4.6.6: ^4.6.6
  minimatch@>=10.0.0 <11.0.1: ^11.0.1

preferWorkspacePackages: true
