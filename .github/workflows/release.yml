name: Release

# Two jobs, one workflow, on purpose.
#
# release-please opens a release pull request; merging it bumps the four
# package versions, writes CHANGELOG.md, creates the `vX.Y.Z` tag and the
# GitHub Release. Publishing then has to happen in *this same workflow run*:
# a tag pushed with `GITHUB_TOKEN` does not trigger another workflow, so a
# separate tag-triggered publish workflow would sit there and never fire.
#
# Authentication is npm trusted publishing (OIDC) — there is no NPM_TOKEN.
# npm matches the incoming OIDC claim against the trusted publisher configured
# on each package: owner `tortuvshin`, repo `grove`, workflow file
# `release.yml`. **Renaming this file breaks publishing** until the four
# npmjs.com configurations are updated to match.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag or SHA to publish (e.g. v0.10.0-rc.1)'
        required: true
        type: string
      dist_tag:
        description: 'npm dist-tag'
        required: true
        default: next
        type: choice
        options: [next, latest]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Nothing by default. The two jobs below want different things — one writes
# to the repo, the other mints an OIDC token — so an inherited default would
# only ever be too much for one of them, and any job added later would start
# out with a scope nobody chose for it.
permissions: {}

env:
  COREPACK_ENABLE_STRICT: 0

jobs:
  release-please:
    name: Release PR / tag
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      # The release pull request is opened by GITHUB_TOKEN, so CI does not run
      # on it. Its diff is only version bumps plus CHANGELOG.md; if that ever
      # stops being true, swap in a PAT here so the PR gets checked.
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish to npm
    needs: [release-please]
    # `always()` because release-please is skipped on workflow_dispatch, and a
    # skipped dependency would otherwise skip this job too.
    if: >-
      always() &&
      (needs.release-please.outputs.released == 'true' ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # Job-level, and it has to be: if `id-token` is declared at workflow
      # level instead, the publish still succeeds and provenance is silently
      # dropped — the single most common way this pipeline "works" while
      # producing nothing verifiable.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || needs.release-please.outputs.tag }}

      - name: Setup pnpm
        # Must run before setup-node, which hashes the pnpm store for its
        # cache and cannot find pnpm otherwise. pnpm 10 does not talk to the
        # registry itself when publishing: it packs the tarball and shells out
        # to the `npm` that sits next to `node`. The OIDC exchange is npm's
        # job, which is why the npm version is what gets checked below.
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.5

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          # Deliberately no `registry-url`: it writes an .npmrc containing
          # `_authToken=${NODE_AUTH_TOKEN}`, and that unresolved placeholder
          # gets sent as a bearer token, which the registry rejects as a
          # misleading E404 instead of falling through to OIDC.

      - name: npm can speak OIDC
        # Trusted publishing landed in npm 11.5.1. An older npm does not fail
        # on the missing feature — it publishes unauthenticated and the
        # registry answers E404, which reads like a missing package.
        run: |
          set -euo pipefail
          have="$(npm --version)"
          if [ "$(printf '%s\n' 11.5.1 "$have" | sort -V | head -n1)" != "11.5.1" ]; then
            echo "::error::npm $have cannot do trusted publishing; 11.5.1 or newer is required."
            exit 1
          fi
          echo "npm $have"

      - name: Release coordinates are consistent
        # Everything that can be known to be wrong before anything is built.
        # A dispatch at a tag whose package.json files were never bumped
        # publishes nothing, and a prerelease sent to `latest` is handed to
        # every plain `npm install`.
        env:
          REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || needs.release-please.outputs.tag }}
          DIST_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.dist_tag || 'latest' }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./packages/core/package.json').version")"
          for pkg in astro cli starlight; do
            other="$(node -p "require('./packages/$pkg/package.json').version")"
            if [ "$other" != "$version" ]; then
              echo "::error::@grove-dev/$pkg is at $other but @grove-dev/core is at $version. The four packages release in lockstep."
              exit 1
            fi
          done
          case "$REF" in
            v[0-9]*)
              if [ "$REF" != "v$version" ]; then
                echo "::error::Ref $REF does not match the package version $version. Bump the four package.json files in the tagged commit."
                exit 1
              fi
              ;;
          esac
          case "$version" in
            *-*)
              if [ "$DIST_TAG" = "latest" ]; then
                echo "::error::$version is a prerelease and must not be published under the 'latest' dist-tag."
                exit 1
              fi
              ;;
          esac
          echo "Publishing $version from $REF under '$DIST_TAG'"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      - name: Published packages are publishable
        run: node scripts/check-publishable.mjs

      - name: Inspect the tarballs
        # Last look inside the bytes before they leave the runner: LICENSE
        # present, no tests, no `workspace:` ranges left unresolved.
        run: node scripts/check-packaging.mjs

      - name: Publish
        id: publish
        # `-r` skips private packages (so @grove-dev/registry never goes out)
        # and skips versions already on the registry, which makes a re-run
        # after a partial failure safe. `--no-git-checks` because this is a
        # detached checkout of the tag.
        #
        # Provenance is requested through the environment, not `--provenance`.
        # Under `-r`, pnpm rebuilds the argument list for each package and
        # forwards only --tag, --registry, --access, --dry-run, --force and
        # --otp; a `--provenance` flag is accepted and then dropped. The
        # environment is inherited by the `npm publish` pnpm spawns, so this
        # is the form that actually arrives.
        env:
          NPM_CONFIG_PROVENANCE: 'true'
        run: >-
          pnpm -r publish
          --access public
          --no-git-checks
          --tag ${{ github.event_name == 'workflow_dispatch' && inputs.dist_tag || 'latest' }}

      - name: Why the publish failed
        # When the OIDC exchange fails, npm prints ENEEDAUTH or E404 and keeps
        # the reason to itself: the registry's actual answer is logged at
        # `verbose`/`silly`, below what reaches the console. npm's debug log
        # records every level regardless, so pull the answer out of there.
        if: failure() && steps.publish.conclusion == 'failure'
        run: |
          grep -h " oidc " "$HOME"/.npm/_logs/*-debug-0.log \
            || echo "npm logged nothing about OIDC: it never attempted the exchange."

      - name: Confirm provenance attached
        # A publish that succeeds without provenance is the failure mode this
        # whole pipeline exists to prevent, and npm reports it as success.
        # Fail loudly here instead of finding out from a user.
        #
        # Two questions, asked separately. "Is the version visible yet?" —
        # npm accepts the upload and then processes it for up to a few
        # minutes, so that one is polled. "Does it carry provenance?" is
        # asked once the version can be seen. No `--json`: on an E404 npm
        # prints the error object to stdout under --json, and a non-empty
        # string is exactly what this check used to accept as an attestation.
        run: |
          set -euo pipefail
          for pkg in core astro cli starlight; do
            name="@grove-dev/$pkg"
            version="$(node -p "require('./packages/$pkg/package.json').version")"
            seen=""
            for _ in $(seq 1 60); do
              seen="$(npm view "$name@$version" version 2>/dev/null || true)"
              if [ "$seen" = "$version" ]; then break; fi
              sleep 10
            done
            if [ "$seen" != "$version" ]; then
              echo "::error::$name@$version is still not visible on the registry after 10 minutes."
              exit 1
            fi
            predicate="$(npm view "$name@$version" dist.attestations.provenance.predicateType 2>/dev/null || true)"
            if [ -z "$predicate" ]; then
              echo "::error::$name@$version published without provenance attestations."
              exit 1
            fi
            echo "$name@$version — provenance OK ($predicate)"
          done
