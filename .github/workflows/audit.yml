name: Audit

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "packages/**/package.json"
      - "apps/**/package.json"
  pull_request:
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "packages/**/package.json"
      - "apps/**/package.json"
  schedule:
    # Weekly full audit, Mondays at 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

# Cancel superseded runs on the same ref so a force-push doesn't pile
# up weekly audit jobs. Matches the pattern in ci.yml and
# lighthouse-audit.yml.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Minimum-scope token: read repo contents, nothing else. The audit
# job only runs `pnpm audit` and never publishes, so `contents: read`
# is sufficient. Implementation-checklist.md #24.
permissions:
  contents: read

jobs:
  audit:
    name: pnpm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        # Must run BEFORE setup-node: actions/setup-node@v7 with
        # `cache: pnpm` tries to hash the pnpm store during cache setup
        # and errors with "Unable to locate executable file: pnpm" if
        # pnpm isn't on PATH yet. pnpm/action-setup@v6 activates the
        # pinned version via corepack in one step.
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.34.5

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install (no postinstall scripts by default; safer for CI)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Audit production deps
        # `pnpm audit --prod --audit-level=high` fails the job on high/critical.
        # GHSA-jmr9-qjv8-65gv (extract-zip <=2.0.1 unvalidated symlink path
        # traversal) is a transitive dep via
        # lighthouse>puppeteer-core>@puppeteer/browsers>extract-zip. The
        # GHSA lists `Patched versions: None` — no upstream release yet.
        # The vulnerable path only triggers when puppeteer downloads a
        # browser archive; this repo ships a system-installed chromium and
        # never invokes that codepath, so we explicitly ignore the
        # advisory. Remove the `--ignore` once extract-zip publishes a fix
        # (tracking issue: GHSA-jmr9-qjv8-65gv).
        run: pnpm audit --prod --audit-level=high --ignore GHSA-jmr9-qjv8-65gv

      - name: Audit dev deps
        continue-on-error: true
        run: pnpm audit --audit-level=high --ignore GHSA-jmr9-qjv8-65gv
