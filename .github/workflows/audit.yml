name: Audit

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "packages/**/package.json"
      - "apps/**/package.json"
  pull_request:
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "packages/**/package.json"
      - "apps/**/package.json"
  schedule:
    # Weekly full audit, Mondays at 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

# Cancel superseded runs on the same ref so a force-push doesn't pile
# up weekly audit jobs. Matches the pattern in ci.yml and
# lighthouse-audit.yml.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Minimum-scope token: read repo contents, nothing else. The audit
# job only runs `pnpm audit` and never publishes, so `contents: read`
# is sufficient. Implementation-checklist.md #24.
permissions:
  contents: read

jobs:
  audit:
    name: pnpm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        # Must run BEFORE setup-node: actions/setup-node@v7 with
        # `cache: pnpm` tries to hash the pnpm store during cache setup
        # and errors with "Unable to locate executable file: pnpm" if
        # pnpm isn't on PATH yet. pnpm/action-setup@v4 activates the
        # pinned version via corepack in one step.
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install (no postinstall scripts by default; safer for CI)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Audit production deps
        # `pnpm audit --prod --audit-level=high` fails the job on high/critical.
        run: pnpm audit --prod --audit-level=high

      - name: Audit dev deps
        continue-on-error: true
        run: pnpm audit --audit-level=high
