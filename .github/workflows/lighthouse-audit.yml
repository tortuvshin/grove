name: Lighthouse Audit

on:
  push:
    branches: [main]
    paths:
      - "packages/core/**"
      - "packages/cli/**"
      - "packages/astro/**"
      - "apps/example/**"
      - ".github/workflows/lighthouse-audit.yml"
  pull_request:
    paths:
      - "packages/core/**"
      - "packages/cli/**"
      - "packages/astro/**"
      - "apps/example/**"
      - ".github/workflows/lighthouse-audit.yml"
  schedule:
    - cron: "37 6 * * 1"
  workflow_dispatch:

concurrency:
  group: lighthouse-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: grove audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The audit job alone escalates permissions for the PR comment
    # step at the bottom. All other jobs keep the workflow's default
    # `contents: read`.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - name: Setup pnpm
        # Must run BEFORE setup-node: actions/setup-node@v7 with
        # `cache: pnpm` tries to hash the pnpm store during cache setup
        # and errors with "Unable to locate executable file: pnpm" if
        # pnpm isn't on PATH yet. pnpm/action-setup@v6 activates the
        # pinned version via corepack in one step.
        uses: pnpm/action-setup@v6
        with:
          version: 10.12.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install Chromium
        # Pin the Chromium version (Ubuntu 24.04's chromium-browser
        # metapackage currently resolves to 140.*) so an Ubuntu
        # snapshot change can't silently shift the audit scores.
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser
          chromium-browser --version
          echo "CHROME_PATH=$(which chromium-browser)" >> $GITHUB_ENV
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @grove-dev/core --filter @grove-dev/cli --filter @grove-dev/astro -r build
      - run: pnpm --dir apps/example build
      - name: Start astro preview server
        # The audit hits `http://127.0.0.1:4321` (grove.config.ts → audit.baseUrl).
        # Without a server, lighthouse returns a result with all categories/audits
        # missing and every score collapses to 0 / Infinity, producing 82 false
        # budget violations. `astro preview` defaults to IPv6 `[::1]`; force IPv4
        # to match the audit target. Mirrors the boot in tests/integration/grove-audit.test.ts.
        # `nohup ... &` detaches the child from the step's shell so it survives
        # past the step's exit and the runner doesn't kill it on the next step.
        run: |
          nohup pnpm --dir apps/example preview --host 127.0.0.1 --port 4321 \
            > /tmp/astro-preview.log 2>&1 &
          PREVIEW_PID=$!
          echo "Started astro preview (pid=${PREVIEW_PID})"
          for i in {1..60}; do
            if curl -fsS -o /dev/null http://127.0.0.1:4321/; then
              echo "Preview server is up after ${i}s"
              echo "PREVIEW_PID=${PREVIEW_PID}" >> $GITHUB_ENV
              exit 0
            fi
            sleep 1
          done
          echo "Preview server did not come up within 60s; log:" >&2
          cat /tmp/astro-preview.log >&2 || true
          kill "${PREVIEW_PID}" 2>/dev/null || true
          exit 1
      - name: Run grove audit
        # The CLI exits non-zero on any budget violation. Pin the audit job's
        # success on that exit code so a Lighthouse regression blocks merges
        # once this workflow is added to the repo's branch-protection
        # required-checks (Settings → Branches → Branch protection rules →
        # "Require status checks to pass before merging"). Runs 3 samples per
        # page and aggregates by median (the audit-cli default); a single
        # sample lands within ~0.05 of 1.0 even on a clean tree, which is
        # well inside the variance the budget allows.
        run: node ../../packages/cli/dist/index.js audit --runs 3 --json lighthouse-report.json --junit lighthouse-junit.xml
        working-directory: apps/example
      - name: Stop preview server
        if: always()
        # Tear down the backgrounded `astro preview` started above so the
        # runner doesn't carry a dangling node process past job cleanup.
        # Use the captured PID when present; fall back to pkill in case the
        # env var didn't survive (e.g. the preview started before $GITHUB_ENV
        # was written into).
        run: |
          if [ -n "${PREVIEW_PID:-}" ]; then
            kill "${PREVIEW_PID}" 2>/dev/null || true
          fi
          pkill -f 'astro preview' 2>/dev/null || true
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: lighthouse-report
          path: |
            apps/example/lighthouse-report.json
            apps/example/lighthouse-junit.xml

      - name: Post scorecard on PR
        # When the workflow runs on a pull_request, post / update a
        # single scorecard comment under the PR. We tag the body with
        # a hidden marker so subsequent runs find + update the same
        # comment instead of stacking new ones. v0.5.0 roadmap item
        # "Lighthouse audit on every PR".
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          LIGHTHOUSE_REPORT: apps/example/lighthouse-report.json
        with:
          script: |
            const fs = require('fs');
            const path = process.env.LIGHTHOUSE_REPORT;
            const marker = '<!-- lighthouse-audit-marker -->';
            if (!fs.existsSync(path)) {
              console.log(`No ${path} — skipping PR comment.`);
              return;
            }
            const report = JSON.parse(fs.readFileSync(path, 'utf8'));
            const total = report.results ? report.results.length : 0;
            const violations = report.violations || [];
            const lines = [];
            lines.push(marker);
            lines.push(`## 📊 Lighthouse audit`);
            lines.push('');
            lines.push(`- Combinations audited: ${total}`);
            lines.push(`- Budget violations: ${violations.length}`);
            lines.push('');
            if (violations.length === 0) {
              lines.push('✅ Every page × profile combination passed the budget.');
            } else {
              lines.push('⛔ Budget violations:');
              for (const v of violations.slice(0, 30)) {
                lines.push(`- [${v.profile}] ${v.page.path} ${v.category}.${v.name}: expected ${v.expected}, got ${v.actual}`);
              }
              if (violations.length > 30) {
                lines.push(`- …and ${violations.length - 30} more. Full JSON in the artifact.`);
              }
            }
            lines.push('');
            lines.push('Full report: see the `lighthouse-report` artifact on this run.');
            const body = lines.join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const existing = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 },
              (resp) => resp.data,
            );
            const prior = existing.find((c) => c.body && c.body.includes(marker));
            if (prior) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: prior.id, body,
              });
              console.log(`Updated existing comment id=${prior.id}`);
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body,
              });
              console.log(`Created new scorecard comment`);
            }
