name: CI

on:
  push:
    branches: [main, v1]
  pull_request:
    branches: [main, v1]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Minimum-scope token: read repo contents, nothing else. Jobs that
# publish or push branches inherit this and add the scope they need
# inside the job. Default GitHub-Actions token grants write on most
# scopes; declaring `contents: read` is the Phase-13 hardening gate.
# Implementation-checklist.md #24.
permissions:
  contents: read

env:
  # Use Corepack to pin pnpm to the version declared in package.json.
  COREPACK_ENABLE_STRICT: 0

jobs:
  build:
    name: Build & type-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        # Must run BEFORE setup-node: actions/setup-node@v7 with
        # `cache: pnpm` tries to hash the pnpm store during cache setup
        # and errors with "Unable to locate executable file: pnpm" if
        # pnpm isn't on PATH yet. pnpm/action-setup@v6 activates the
        # pinned version via corepack in one step.
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.5

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      - name: Type-check
        # Also runs `@grove-dev/registry`'s check: registry.json must be
        # consistent with packages/registry/default/ (coverage, derived
        # registryDependencies, file types, targets, forbidden imports).
        run: pnpm -r check

      - name: apps/example mirrors the registry
        # apps/example is the reference consumer — every file of the
        # generated `default` scaffold must exist at its target there,
        # byte-identical. Catches an edit made on one side only.
        run: pnpm example:check

  test:
    name: Scaffold smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.5

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build (needed for the CLI to run from dist)
        run: pnpm -r build

      - name: Run scaffold test
        # Two passes: the default scaffold, then the same install on
        # non-default `routes.directory` with real records — the shape a
        # component hardcoding `/projects` cannot survive.
        run: pnpm test:scaffold

      - name: Single registry items install with their dependencies
        # `grove init` only ever installs `@grove/default`, which inlines
        # everything and declares no registryDependencies. This installs
        # `@grove/browse` off a loopback server so the documented
        # `shadcn add @grove/<item>` flow is exercised for real.
        run: pnpm registry:install-check

  test-pnpm-next:
    name: Scaffold smoke test (pnpm next)
    # Consumers do not run the pnpm this repo pins. pnpm 11 turned an
    # unapproved dependency build script into a hard error, which killed
    # the `pnpm add` inside `shadcn add` and shipped a `grove init` that
    # left every consumer with a package.json and no src/ — invisible to
    # every job above, all of which pin 10.34.5. This job runs the
    # consumer path on the newest pnpm so the next such break fails here
    # instead of on someone's machine.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    # The scaffold has to work on the pinned pnpm; whether it works on an
    # unreleased one is a warning, not a merge gate.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        # The repo's own install stays on the pinned version — only the
        # scaffold the CLI creates is exercised under the newer one.
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.5

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build (needed for the CLI to run from dist)
        run: pnpm -r build

      - name: Switch pnpm to the latest release
        # pnpm self-manages versions: inside this repo it re-execs the
        # `packageManager` pin, so test-scaffold.mjs's repo-root steps
        # keep running on 10.34.5 no matter what is installed here. The
        # scaffold it creates carries no pin, so everything run inside it
        # — `grove init`'s `pnpm dlx shadcn`, its `pnpm install`, the
        # final `pnpm build` — picks up this version. That is the part
        # under test. The temp-dir check prints which version that is.
        run: |
          npm install -g pnpm@latest
          cd "$(mktemp -d)" && pnpm --version

      - name: Run scaffold test
        # `node`, not `pnpm test:scaffold`: a pnpm-run script puts its own
        # pnpm first on the child PATH, so going through the script alias
        # would silently hand the scaffold 10.34.5 again and this job
        # would test nothing.
        run: node scripts/test-scaffold.mjs

  unit:
    name: Unit tests (vitest)
    # Runs the workspace vitest suite — 22 unit-test files across
    # `@grove-dev/{core,ui,astro,cli,starlight}`. Without this job,
    # regressions in the parser/generator/audit helpers ship undetected
    # because the existing `test` job only exercises the scaffold
    # end-to-end smoke. Implementation-checklist.md #17 (P0).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.5

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The page-parity test reads apps/example/dist/**.html and the
      # grove-audit integration tests boot a dev server against
      # apps/example's build output. Both need the example built first;
      # `needs: build` only serializes the *jobs*, not their filesystem
      # state, since each job runs on a fresh runner. apps/example's
      # Astro config imports `@grove-dev/astro`, which is a workspace
      # package with no built dist on a fresh runner, so the full
      # recursive build is required (matches the `test` job).
      - name: Build all workspaces
        run: pnpm -r build

      - name: Run unit tests
        run: pnpm test

  lint:
    name: Repo hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.5

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # `pnpm icons:check` (via `scripts/sync-icons.mjs`) imports the
      # `@iconify-json/*` packages at the repo root. Without an
      # `install` step this lint job fails with
      # `Error: @iconify-json/logos is not installed — run pnpm install`.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check for stray .DS_Store
        run: |
          if find . -name '.DS_Store' -not -path './node_modules/*' -not -path './*/node_modules/*' -print -quit | grep -q .; then
            echo "::error::Found .DS_Store files committed to the repo. Please delete them."
            find . -name '.DS_Store' -not -path './node_modules/*' -not -path './*/node_modules/*' -print
            exit 1
          fi

      - name: Published packages are publishable
        # Two invariants. (1) `pnpm publish` rewrites `workspace:*` to the
        # dependency's version. If that dependency is private, the tarball
        # points at a version that was never released and `npm install` 404s —
        # while the monorepo keeps working, because pnpm resolves the link
        # locally. The grep this replaced could never fail: its own
        # `\|workspace:` filter matched every line the first grep could emit.
        # (2) Every published package carries its own LICENSE and an explicit
        # `files` array — npm never pulls the root LICENSE into a subpackage
        # tarball, and a missing `files` packs the whole directory.
        run: node scripts/check-publishable.mjs

      - name: Docs slugs, internal links, version references
        # Catches broken /guides/... cross-links that would otherwise ship
        # to production (the Starlight build only surfaces them per-page).
        # Sibling to `scripts/check-starlight-sidebar.mjs`; together they
        # implement the v0.5.0 "Strict internal-link lint" roadmap item.
        # `check-version-refs.mjs` additionally holds the landing page and
        # roadmap to the released version: those strings are rewritten by
        # release-please, which fails silently if an annotation is dropped.
        run: pnpm docs:check

      - name: Icon set is regenerable
        # The committed SVGs must be exactly what `scripts/sync-icons.mjs`
        # produces from `scripts/icons.config.mjs`. Catches a hand-edited
        # icon, a stale `pnpm icons:sync`, and drift between the packaged
        # set and the `grove init` scaffold's copy. The structural
        # invariants (no baked colors in a mono mark, no orphan files)
        # run in `pnpm test`; this is the byte-for-byte check that needs
        # the Iconify devDependencies.
        run: pnpm icons:check

  packaging:
    name: Tarball hygiene
    # What ships is not what the repo looks like: `pnpm pack` applies the
    # `files` filter and resolves `workspace:*` to a concrete version. This
    # job packs all four publishable packages and inspects the tarballs —
    # LICENSE present, no tests, no build caches, no leftover `workspace:`
    # ranges — then runs publint and @arethetypeswrong/cli over them.
    # `@grove-dev/astro` and `@grove-dev/starlight` are advisory-only there:
    # both export raw `.ts`/`.astro` for Vite to compile, which both tools
    # correctly report and which is the intended design.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.5

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # `@grove-dev/cli`'s build copies `../registry/dist/r` into its own
      # dist/, so the registry has to be built before the CLI can be packed
      # into anything resembling the real tarball.
      - name: Build all workspaces
        run: pnpm -r build

      - name: Inspect the tarballs
        run: node scripts/check-packaging.mjs --out packed

      - name: Upload the tarballs
        # Keeps the exact bytes a reviewer would otherwise have to rebuild
        # locally to answer "what would this PR publish?".
        uses: actions/upload-artifact@v5
        with:
          name: tarballs
          path: packed/*.tgz
          retention-days: 14
