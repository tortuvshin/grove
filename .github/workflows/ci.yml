name: CI

on:
  push:
    branches: [main, v1]
  pull_request:
    branches: [main, v1]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Minimum-scope token: read repo contents, nothing else. Jobs that
# publish or push branches inherit this and add the scope they need
# inside the job. Default GitHub-Actions token grants write on most
# scopes; declaring `contents: read` is the Phase-13 hardening gate.
# Implementation-checklist.md #24.
permissions:
  contents: read

env:
  # Use Corepack to pin pnpm to the version declared in package.json.
  COREPACK_ENABLE_STRICT: 0

jobs:
  build:
    name: Build & type-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        # Must run BEFORE setup-node: actions/setup-node@v7 with
        # `cache: pnpm` tries to hash the pnpm store during cache setup
        # and errors with "Unable to locate executable file: pnpm" if
        # pnpm isn't on PATH yet. pnpm/action-setup@v6 activates the
        # pinned version via corepack in one step.
        uses: pnpm/action-setup@v6
        with:
          version: 10.12.1

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      - name: Type-check
        # Also runs `@grove-dev/registry`'s check: registry.json must be
        # consistent with packages/registry/default/ (coverage, derived
        # registryDependencies, file types, targets, forbidden imports).
        run: pnpm -r check

      - name: apps/example mirrors the registry
        # apps/example is the reference consumer — every file of the
        # generated `default` scaffold must exist at its target there,
        # byte-identical. Catches an edit made on one side only.
        run: pnpm example:check

  test:
    name: Scaffold smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.12.1

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build (needed for the CLI to run from dist)
        run: pnpm -r build

      - name: Run scaffold test
        # Two passes: the default scaffold, then the same install on
        # non-default `routes.directory` with real records — the shape a
        # component hardcoding `/projects` cannot survive.
        run: pnpm test:scaffold

      - name: Single registry items install with their dependencies
        # `grove init` only ever installs `@grove/default`, which inlines
        # everything and declares no registryDependencies. This installs
        # `@grove/browse` off a loopback server so the documented
        # `shadcn add @grove/<item>` flow is exercised for real.
        run: pnpm registry:install-check

  unit:
    name: Unit tests (vitest)
    # Runs the workspace vitest suite — 22 unit-test files across
    # `@grove-dev/{core,ui,astro,cli,starlight}`. Without this job,
    # regressions in the parser/generator/audit helpers ship undetected
    # because the existing `test` job only exercises the scaffold
    # end-to-end smoke. Implementation-checklist.md #17 (P0).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.12.1

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The page-parity test reads apps/example/dist/**.html and the
      # grove-audit integration tests boot a dev server against
      # apps/example's build output. Both need the example built first;
      # `needs: build` only serializes the *jobs*, not their filesystem
      # state, since each job runs on a fresh runner. apps/example's
      # Astro config imports `@grove-dev/astro`, which is a workspace
      # package with no built dist on a fresh runner, so the full
      # recursive build is required (matches the `test` job).
      - name: Build all workspaces
        run: pnpm -r build

      - name: Run unit tests
        run: pnpm test

  lint:
    name: Repo hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.12.1

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # `pnpm icons:check` (via `scripts/sync-icons.mjs`) imports the
      # `@iconify-json/*` packages at the repo root. Without an
      # `install` step this lint job fails with
      # `Error: @iconify-json/logos is not installed — run pnpm install`.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check for stray .DS_Store
        run: |
          if find . -name '.DS_Store' -not -path './node_modules/*' -not -path './*/node_modules/*' -print -quit | grep -q .; then
            echo "::error::Found .DS_Store files committed to the repo. Please delete them."
            find . -name '.DS_Store' -not -path './node_modules/*' -not -path './*/node_modules/*' -print
            exit 1
          fi

      - name: Published packages depend only on publishable packages
        # `pnpm publish` rewrites `workspace:*` to the dependency's version.
        # If that dependency is private, the tarball points at a version that
        # was never released and `npm install` 404s — while the monorepo keeps
        # working, because pnpm resolves the link locally. The grep this
        # replaced could never fail: its own `\|workspace:` filter matched
        # every line the first grep could emit.
        run: node scripts/check-publishable.mjs

      - name: Docs slugs + internal links
        # Catches broken /guides/... cross-links that would otherwise ship
        # to production (the Starlight build only surfaces them per-page).
        # Sibling to `scripts/check-starlight-sidebar.mjs`; together they
        # implement the v0.5.0 "Strict internal-link lint" roadmap item.
        run: pnpm docs:check

      - name: Icon set is regenerable
        # The committed SVGs must be exactly what `scripts/sync-icons.mjs`
        # produces from `scripts/icons.config.mjs`. Catches a hand-edited
        # icon, a stale `pnpm icons:sync`, and drift between the packaged
        # set and the `grove init` scaffold's copy. The structural
        # invariants (no baked colors in a mono mark, no orphan files)
        # run in `pnpm test`; this is the byte-for-byte check that needs
        # the Iconify devDependencies.
        run: pnpm icons:check
