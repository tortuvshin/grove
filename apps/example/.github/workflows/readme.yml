name: Update README

on:
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch:

jobs:
  readme:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Regenerate README
        run: pnpm exec grove readme generate
      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet README.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Open PR
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(readme): regenerate awesome-list entries"
          title: "Update README (awesome-list)"
          branch: chore/readme-regenerate
          delete-branch: true
          add-paths: README.md