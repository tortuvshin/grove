name: Cleanup report

on:
  schedule:
    # POSIX cron ORs day-of-month with day-of-week when both are
    # restricted, so "0 5 1-7 * 1" fired on the 1st-7th *and* every
    # Monday — about ten times a month. Plain day-of-month keeps it
    # genuinely monthly.
    - cron: "0 5 1 * *"
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec grove cleanup | tee cleanup-report.md
      - run: cat cleanup-report.md >> "$GITHUB_STEP_SUMMARY"
