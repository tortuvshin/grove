<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>Grove — The framework for community knowledge</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#091116"/>
      <stop offset="100%" stop-color="#111d25"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g transform="translate(96, 96)">
    <rect width="56" height="56" rx="14" fill="#13212a" stroke="#365666"/>
    <g transform="translate(8, 8)" stroke="#7dd3d8" stroke-width="1.6" fill="none" stroke-linejoin="round">
      <path d="M30 30 H40 V10 H10 V20"/>
      <path d="M30 30 V16 L16 30"/>
      <path d="M30 30 V40 H10 V20"/>
      <path d="M10 20 V36"/>
    </g>
  </g>
  <g transform="translate(96, 240)" fill="#e3f3f5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <text x="0" y="0" font-size="84" font-weight="700" letter-spacing="-2">Grove</text>
    <text x="0" y="74" font-size="84" font-weight="700" letter-spacing="-2">Publish knowledge</text>
    <text x="0" y="158" font-size="84" font-weight="700" letter-spacing="-2">that stays current.</text>
    <text x="0" y="240" font-size="32" font-weight="500" fill="#89a8b3">Plain files in. A searchable site, its SEO and</text>
    <text x="0" y="282" font-size="32" font-weight="500" fill="#89a8b3">AI outputs, and a README — all kept in sync.</text>
  </g>
  <g transform="translate(96, 558)" fill="#718b95" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="22">
    <text x="0" y="0">npx @grove-dev/cli@latest init my-space</text>
    <text x="900" y="0">withgrove.dev</text>
  </g>
</svg>
