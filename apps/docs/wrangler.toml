# Cloudflare Workers static-assets configuration for the Grove docs site.
#
# The docs site is a fully static Astro build that emits `dist/`. The
# Cloudflare build environment runs `wrangler deploy` (the Workers CLI,
# not `wrangler pages deploy`), so the `[assets]` schema below is the
# correct shape — wrangler uploads `./dist` as static assets attached to
# a Worker.
#
# Why this file is here at all:
#
# Without it, wrangler's `runAutoConfig` downloads `@astrojs/cloudflare`
# and injects it into `astro.config.mjs`. The adapter's vite plugin
# transitively requires `prismjs` (a devDependency of
# `@astrojs/cloudflare`, not bundled with it), producing:
#
#   Cannot find package 'prismjs' imported from
#   .../@astrojs/cloudflare/dist/vite-plugin-prism.js
#
# Pages schema (`pages_build_output_dir`) was tried first, but wrangler
# rejects the Pages schema when the build env runs `wrangler deploy`
# instead of `wrangler pages deploy`. The two schemas are mutually
# exclusive — pick one per project.
#
# Cloudflare Dashboard settings that go with this file:
#
#   Root directory:  apps/docs          (after the 2026-07-23 refactor
#                                       moved docs/ → apps/docs/)
#   Build command:   pnpm build
#   Build output:    dist
#
# If the Dashboard's Root directory points at the pre-refactor `docs/`
# path, the clone step fails with "Failed: root directory not found"
# before any wrangler command runs. Update the Root directory to
# `apps/docs` to fix it.

name = "grove"
compatibility_date = "2026-06-11"

[assets]
directory = "./dist"
